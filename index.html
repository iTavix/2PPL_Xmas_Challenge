<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard 2PPL XMAS CHALLENGE</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* --- STILI BASE --- */
        body { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; background-color: #f0f4f8; margin: 0; padding: 0; color: #1c1e21; -webkit-font-smoothing: antialiased; }
        .dashboard { max-width: 900px; margin: 30px auto; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; }
        
        /* HEADER */
        header { background-color: #ffffff; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0f0f0; }
        header h1 { margin: 0; font-size: 28px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #000; text-align: center; }
        .logo { height: 60px; width: auto; object-fit: contain; }
        
        /* CONTROLLI */
        .controls-area { text-align: center; padding: 10px; background: #fafafa; border-bottom: 1px solid #eee; }
        .toggle-btn { background: #fff; border: 1px solid #ddd; color: #333; padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .toggle-btn.active { background: #333; color: white; border-color: #333; }
        
        /* ADMIN PANEL */
        .admin-panel { max-height: 0; opacity: 0; overflow: hidden; transition: all 0.4s; background: #f7f9fa; border-bottom: 1px solid #eee; }
        .admin-panel.open { max-height: 500px; opacity: 1; padding: 20px; }
        .input-card { background: white; padding: 10px; border-radius: 10px; border: 1px solid #eee; display: inline-flex; flex-direction: column; align-items: center; margin: 5px; width: 80px; }
        .input-card input { width: 50px; text-align: center; font-size: 16px; font-weight: bold; border: 2px solid #eee; border-radius: 5px; padding: 5px; }
        .update-btn { background: #3ecf8e; color: #1c1e21; border: none; padding: 10px 25px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 6px rgba(62, 207, 142, 0.3); }
        .update-btn:hover { background: #34b27b; }
        .update-btn:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }
        
        /* PODIO */
        .podium-section { padding: 40px 20px; display: flex; justify-content: center; align-items: flex-end; gap: 15px; height: 300px; }
        .podium-card { background: white; border-radius: 15px; padding: 10px; width: 30%; text-align: center; position: relative; box-shadow: 0 10px 20px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .podium-card img { width: 100%; height: 130px; object-fit: cover; border-radius: 10px; margin-bottom: 8px; }
        .winner { transform: scale(1.1); border: 3px solid #eebb4d; z-index: 2; height: 250px; justify-content: flex-start; }
        .second, .third { height: 210px; justify-content: flex-start; border: 1px solid #eee; }
        .second { border-top: 4px solid #c0c0c0; }
        .third { border-top: 4px solid #cd7f32; }
        .badge { position: absolute; top: -15px; width: 32px; height: 32px; line-height: 32px; border-radius: 50%; color: white; font-weight: 800; font-size: 16px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); left: 50%; transform: translateX(-50%); }
        .badge-1 { background: #eebb4d; } .badge-2 { background: #a8a8a8; } .badge-3 { background: #b08d55; }
        
        /* LISTA */
        .list-section { padding: 20px; }
        .section-title { text-align: center; font-size: 18px; font-weight: 700; margin-bottom: 20px; }
        .row { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #eee; background: white; border-radius: 8px; margin-bottom: 5px; }
        .row-rank { font-weight: bold; width: 30px; text-align: center; }
        .row-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; margin: 0 15px; }
        .row-info { flex: 1; font-weight: bold; font-size: 15px; }
        .row-votes { text-align: right; width: 100px; }
        .vote-bar-bg { height: 6px; background: #eee; border-radius: 3px; margin-top: 5px; width: 100%; }
        .vote-fill { height: 100%; background: #3ecf8e; border-radius: 3px; transition: width 0.5s; }

        /* MODALE */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 9999; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.2); border: 1px solid #ddd; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; }
        .modal-img { max-width: 100%; max-height: 50vh; border-radius: 10px; margin: 15px 0; }

        /* MOBILE */
        @media (max-width: 600px) {
            .dashboard { margin: 0; border-radius: 0; }
            header { padding: 10px; }
            .logo { height: 40px; }
            header h1 { font-size: 18px; }
            .podium-section { padding: 30px 10px; gap: 5px; }
            .podium-card { padding: 5px; width: 32%; }
            .podium-card img { height: 80px; }
            .winner { height: 190px; }
            .second, .third { height: 160px; }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <header>
        <img src="logo_2ppl.png" alt="2PPL" class="logo" onerror="this.style.opacity='0'">
        <h1>2PPL XMAS CHALLENGE</h1>
        <img src="cioccolato_bar.png" alt="Cioccolato Bar" class="logo" onerror="this.style.opacity='0'">
    </header>

    <div class="controls-area">
        <button class="toggle-btn" onclick="toggleAdminPanel()">⚙️ Impostazioni</button>
    </div>

    <div class="admin-panel" id="adminPanel">
        <div style="text-align: center;" id="input-container"></div>
        <div style="text-align: center;">
            <button class="update-btn" id="saveBtn" onclick="saveToSupabase()">Salva su Database</button>
            <div id="statusMsg" style="margin-top:10px; font-weight:bold; font-size:12px; min-height:20px;"></div>
        </div>
    </div>
    
    <div class="podium-section" id="podium-container"></div>
    
    <div class="list-section">
        <div class="section-title">Classifica Completa</div>
        <div id="list-container"></div>
    </div>
</div>

<div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="m-title"></h2>
        <img id="m-img" class="modal-img" src="">
        <div id="m-votes" style="font-size: 1.5em; font-weight: 800;"></div>
    </div>
</div>

<script>
    // ==========================================
    // ⚙️ CONFIGURAZIONE SUPABASE
    // ==========================================
    const SUPABASE_URL = 'https://nfahnheyfyexjipfgicu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mYWhuaGV5ZnlleGppcGZnaWN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwNTg1MTEsImV4cCI6MjA4MDYzNDUxMX0.Mkidgj3RAf3g3eXBBS2oTxe6wGuN4dg220qc8rFIUuc';
    // ==========================================

    const supabase =  window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Mappatura locale per le immagini (Supabase salva solo ID e Voti)
    const imgMap = {
        "Foto 1": "foto1.jpg",
        "Foto 2": "foto2.jpg",
        "Foto 3": "foto3.jpg",
        "Foto 4": "foto4.jpg",
        "Foto 5": "foto5.jpg"
    };

    let photos = [];

    window.onload = async function() {
        if(SUPABASE_URL.includes("INSERISCI")) {
            alert("⚠️ Devi inserire URL e KEY di Supabase nel codice HTML!");
            return;
        }
        await loadFromSupabase();
    };

    // --- CARICAMENTO ---
    async function loadFromSupabase() {
        showStatus("Caricamento da Supabase...", "blue");
        
        // Seleziona tutto dalla tabella 'classifica'
        const { data, error } = await supabase
            .from('classifica')
            .select('*');

        if (error) {
            console.error("Errore Supabase:", error);
            showStatus("Errore nel caricamento dati.", "red");
        } else {
            // Uniamo i dati del DB con le immagini locali
            photos = data.map(item => ({
                id: item.id,
                votes: item.votes,
                src: imgMap[item.id] || 'https://via.placeholder.com/150'
            }));
            
            generateInputs();
            renderAll();
            showStatus("Dati aggiornati!", "green");
            setTimeout(clearStatus, 2000);
        }
    }

    // --- SALVATAGGIO ---
    async function saveToSupabase() {
        const btn = document.getElementById('saveBtn');
        btn.disabled = true; 
        btn.innerText = "Salvataggio...";

        // 1. Aggiorna l'array locale dai valori degli input
        photos.forEach((p, index) => {
            let val = document.getElementById(`vote-${index}`).value;
            p.votes = val === "" ? 0 : parseInt(val);
        });

        // 2. Prepara i dati per Supabase (Solo ID e Votes)
        const updates = photos.map(p => ({
            id: p.id,
            votes: p.votes
        }));

        // 3. Esegui l'Upsert (Inserisci o Aggiorna)
        const { error } = await supabase
            .from('classifica')
            .upsert(updates, { onConflict: 'id' });

        if (error) {
            console.error("Errore Salvataggio:", error);
            showStatus("Errore nel salvataggio.", "red");
        } else {
            showStatus("Salvato con successo!", "green");
            renderAll();
        }

        btn.disabled = false;
        btn.innerText = "Salva su Database";
        setTimeout(clearStatus, 3000);
    }

    // --- FUNZIONI UI ---
    function showStatus(m, c) { const el = document.getElementById('statusMsg'); el.style.color = c; el.innerText = m; }
    function clearStatus() { document.getElementById('statusMsg').innerText = ""; }

    function toggleAdminPanel() {
        const panel = document.getElementById('adminPanel');
        const btn = document.querySelector('.toggle-btn');
        panel.classList.toggle('open');
        btn.classList.toggle('active');
    }

    function generateInputs() {
        const c = document.getElementById('input-container'); c.innerHTML = '';
        // Ordiniamo gli input per ID per trovarli facilmente
        const sortedForInput = [...photos].sort((a,b) => a.id.localeCompare(b.id));
        
        // Mappiamo l'indice corretto
        sortedForInput.forEach((p, i) => {
            // Troviamo l'indice originale nell'array photos principale
            let originalIndex = photos.indexOf(p);
            c.innerHTML += `<div class="input-card"><label>${p.id}</label><input type="number" id="vote-${originalIndex}" value="${p.votes}" min="0"></div>`;
        });
    }

    function renderAll() {
        const sorted = [...photos].sort((a, b) => b.votes - a.votes);
        const max = sorted[0].votes > 0 ? sorted[0].votes : 1;
        const podiumContainer = document.getElementById('podium-container');
        podiumContainer.innerHTML = '';
        const listContainer = document.getElementById('list-container');
        listContainer.innerHTML = '';
        
        // Podio
        [1, 0, 2].forEach(i => {
            if(sorted[i]) {
                let cls = i===0?"winner":i===1?"second":"third";
                let badge = i===0?"#eebb4d":i===1?"#a8a8a8":"#b08d55";
                podiumContainer.innerHTML += `
                <div class="podium-card ${cls}" onclick="openModal('${sorted[i].id}', '${sorted[i].src}', ${sorted[i].votes})">
                    <div class="badge" style="background:${badge}">${i+1}</div>
                    <img src="${sorted[i].src}" onerror="this.src='https://via.placeholder.com/150'">
                    <div style="font-weight:bold; font-size:13px;">${sorted[i].id}</div>
                    <div style="font-size:12px; color:#555;">${sorted[i].votes} Voti</div>
                </div>`;
            }
        });

        // Lista
        sorted.forEach((p, i) => {
            let rank = i+1;
            let icon = rank===1?"🥇":rank===2?"🥈":rank===3?"🥉":rank;
            listContainer.innerHTML += `
            <div class="row">
                <div class="row-rank">${icon}</div>
                <img src="${p.src}" class="row-img" onclick="openModal('${p.id}', '${p.src}', ${p.votes})" onerror="this.src='https://via.placeholder.com/50'">
                <div class="row-info">${p.id}</div>
                <div class="row-votes">
                    <div>${p.votes} Voti</div>
                    <div class="vote-bar-bg"><div class="vote-fill" style="width:${(p.votes/max)*100}%"></div></div>
                </div>
            </div>`;
        });
    }

    function openModal(t, s, v) {
        document.getElementById('m-title').innerText = t;
        document.getElementById('m-img').src = s;
        document.getElementById('m-votes').innerText = v + " Voti";
        document.getElementById('modal').style.display = "flex";
    }
    function closeModal() { document.getElementById('modal').style.display = "none"; }
</script>

</body>
</html>
